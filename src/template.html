<!DOCTYPE html>
<html lang="zh-CN">

    <title>{{title}}</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon"/>
    <link rel="stylesheet" type="text/css" href="styles.css"/>

    <!-- Global site tag (gtag.js) - Google Analytics -->

<body>
<aside class="sidebar">
    <div class="sidebar__brand">
        <span class="sidebar__brand-icon"><img src="icons/link.svg" alt=""></span>
        <span class="sidebar__brand-text">{{title}}</span>
    </div>
    <nav class="sidebar__nav">
        {{navigation}}
    </nav>
</aside>
<main class="main">
    <div class="main__content">
        {{content}}
    </div>
